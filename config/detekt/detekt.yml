complexity:
  LongParameterList:
    allowedFunctionParameters: 6
    allowedConstructorParameters: 7
    ignoreDefaultParameters: true
    ignoreDataClasses: true

naming:
  FunctionNaming:
    excludeClassPattern: '.*(Test|Tests|IT|IntegrationTests)$'
  PackageNaming:
    # 언더스코어 제거 — detekt 기본 패턴 기준으로 복원
    packagePattern: '[a-z]+(\.[a-z][a-z0-9]*)*'

style:
  # detekt 기본 MaxLineLength 비활성화 → ktlint MaximumLineLength로 단일화
  MaxLineLength:
    active: false
  # detekt 기본 ModifierOrder 비활성화 → ktlint ModifierOrdering으로 단일화
  ModifierOrder:
    active: false
  NewLineAtEndOfFile:
    active: false
  ReturnCount:
    excludeGuardClauses: true
  ThrowsCount:
    excludeGuardClauses: true
  UnusedParameter:
    allowedNames: 'ignored|expected|ignored.*'
  # detekt 기본 WildcardImport 비활성화 → ktlint NoWildcardImports로 단일화
  WildcardImport:
    active: false

ktlint:
  code_style: ktlint_official
  Filename:
    active: false
  FinalNewline:
    active: true
  MaximumLineLength:
    active: true
    maxLineLength: 120
  ModifierOrdering:
    active: true
  NoWildcardImports:
    active: false
  PackageName:
    # detekt naming.PackageNaming이 패키지 명명 규칙을 담당하므로 중복 비활성화
    active: false
  PropertyName:
    active: false
