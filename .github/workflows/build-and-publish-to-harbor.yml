name: Build & Publish to Harbor

env:
  HARBOR_REGISTRY: harbor-cicd.ktcloud.com
  HARBOR_PROJECT: kt-cloud-service
  HARBOR_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
  HARBOR_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
  IMAGE_NAME: kcp-network-consumer

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }} @ ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-tag:
    runs-on:
      group: enterprise/Default
      labels: cicd-ys-ext-build-worker

    permissions:
      contents: write
      packages: write
      id-token: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get Previous tag
        id: previoustag
        uses: WyriHaximus/github-action-get-previous-tag@v2
        with:
          fallback: v1.0.0

      - name: Get next patch version
        id: semvers
        uses: WyriHaximus/github-action-next-semvers@v1
        with:
          version: ${{ steps.previoustag.outputs.tag }}

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Gradlew Permission
        run: chmod +x ./gradlew

      - name: Build application jar
        run: ./gradlew clean bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64

      - name: Login to Harbor
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Build and push Docker image to Harbor
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}:v${{ steps.semvers.outputs.patch }}

      - name: Tag and Push
        env:
          NEW_TAG: v${{ steps.semvers.outputs.patch }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"
