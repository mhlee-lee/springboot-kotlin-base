server:
  port: 18080

spring:
  application:
    name: kotlin_base
  messages:
    basename: messages/message,validations/validation,enums/enum,errors/error
    fallback-to-system-locale: false
  web:
    locale: ko_KR

  sql:
    init:
      mode: never
  datasource:
    url: jdbc:h2:mem:kotlinbase;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20

management:
  endpoints:
    web:
      exposure:
        include: "*"

logging:
  pattern:
    level: "%5p [traceId:%X{traceId:-}]"
  level:
    org.test.kotlin_base: DEBUG
    org.springframework: ERROR
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.transaction: DEBUG
